<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{doctitle}}</title>
<meta name="description" content="{{description}}">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23f2ecdd'/%3E%3Cg fill='none' stroke='%231a1714' stroke-width='2.6'%3E%3Ccircle cx='32' cy='32' r='22'/%3E%3Ccircle cx='32' cy='32' r='11'/%3E%3C/g%3E%3Cg stroke='%23b32a1c' stroke-width='1.6'%3E%3Cpath d='M32 5v54M5 32h54'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Sometype+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<!--  ABSOLUTE, not relative.  These were `../jock-highlight.css`,
      which from /reference/tags/ resolves to
      /reference/jock-highlight.css --- a 404 on every generated
      page, so the highlighter never loaded and the listings were
      marked `class="code jock"` for a script that was not there.
      The site is served at an apex root, so an absolute path is
      correct and is immune to however deep a page is nested.  -->
<link rel="stylesheet" href="/jock-highlight.css">
<script src="/jock-highlight.js" defer></script>
<!--
  HAND-MAINTAINED.  This is the only file in the reference that a
  person edits:  tools/refgen.py in the compiler repo fills
  the four placeholders below and writes the pages beside it.
  Naming them here in their own spelling would be a bug:  the
  substitution is a plain string replace, so a comment mentioning a
  placeholder gets the substitution too --- which silently injected
  the whole document into this comment, doubling every page, until
  2026-10-27.  Nor may this comment contain a close-comment
  sequence;  the sentence that said so, spelling it out, closed the
  comment early and spilled the rest of this text onto the page.  Design lives here, content is generated, and
  neither needs the other to change.

  Styling is /jock.css, authored from design/style-guide.html ---
  the design system's own document, which is a visual specimen of
  inline styles rather than a stylesheet.  This page carries NO copy
  of it:  that was the whole point of extracting it.

  Jekyll ignores a file whose name starts with `_`, so this template
  is never served.
-->
<link rel="stylesheet" href="/jock.css">
</head>
<body>
<div class="page">
<header class="bar">
  <nav><a href="/">jock</a> <span>reference</span></nav>
  <span>{{subtitle}}</span>
</header>
<main class="prose">
<h1 class="ruled">{{title}}</h1>
<p class="sub">{{blurb}}</p>
<!--  §3:  text column beside the 186px margin rail.  A marginal
      floats into the rail where it was written, so it sits beside
      its referent;  the rail is empty wherever nothing was said,
      which §7 calls correct.  -->
{{body}}
</main>
</div>
</body>
</html>
