<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{title}} — Jock reference</title>
<meta name="description" content="{{blurb}}">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23f2ecdd'/%3E%3Cg fill='none' stroke='%231a1714' stroke-width='2.6'%3E%3Ccircle cx='32' cy='32' r='22'/%3E%3Ccircle cx='32' cy='32' r='11'/%3E%3C/g%3E%3Cg stroke='%23b32a1c' stroke-width='1.6'%3E%3Cpath d='M32 5v54M5 32h54'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Sometype+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<!--  ABSOLUTE, not relative.  These were `../jock-highlight.css`,
      which from /reference/tags/ resolves to
      /reference/jock-highlight.css --- a 404 on every generated
      page, so the highlighter never loaded and the listings were
      marked `class="code jock"` for a script that was not there.
      The site is served at an apex root, so an absolute path is
      correct and is immune to however deep a page is nested.  -->
<link rel="stylesheet" href="/jock-highlight.css">
<script src="/jock-highlight.js" defer></script>
<!--
  HAND-MAINTAINED.  This is the only file in the reference that a
  person edits:  tools/refgen.py in the compiler repo fills
  {{title}}, {{subtitle}}, {{blurb}} and {{body}} and writes the
  pages beside it.  Design lives here, content is generated, and
  neither needs the other to change.

  The tokens below are the same twelve every page on the site
  redeclares (index, philosophy, reviewers, supporters) --- the house
  pattern, and one copy here serves every generated page instead of
  adding a fifth.

  Jekyll ignores a file whose name starts with `_`, so this template
  is never served.
-->
<style>
  :root{
    --desk:#dcd7cc;
    --paper:#f2ecdd;
    --ink:#1a1714;
    --ink-body:#231f1a;
    --ink-soft:#3a342c;
    --muted:#6b6459;
    --muted-2:#8c857a;
    --red:#b32a1c;
    --red-hover:#8c1f14;
    --hair:rgba(0,0,0,.25);
    --hair-soft:rgba(0,0,0,.12);
    --serif:'Zilla Slab',Georgia,serif;
    --mono:'Sometype Mono',monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{background:var(--desk)}
  body{
    background:var(--desk);
    color:var(--ink-body);
    font-family:var(--serif);
    -webkit-font-smoothing:antialiased;
  }
  .page{
    max-width:900px;margin:0 auto;background:var(--paper);
    border-left:1px solid var(--hair);border-right:1px solid var(--hair);
    min-height:100vh;
  }
  header.bar{
    display:flex;align-items:baseline;gap:14px;
    padding:14px 40px;border-bottom:1px solid var(--hair);
    font:500 11px/1 var(--mono);letter-spacing:.18em;
    text-transform:uppercase;color:var(--muted);
  }
  header.bar a{color:var(--red);text-decoration:none}
  header.bar a:hover{color:var(--red-hover)}
  main{padding:34px 40px 60px}
  h1{
    font:600 30px/1.15 var(--serif);color:var(--ink);
    margin-bottom:6px;letter-spacing:-.01em;
  }
  .sub{
    font:400 14px/1.6 var(--serif);color:var(--muted);
    margin-bottom:24px;max-width:62ch;
  }
  h2{
    font:600 11px/1 var(--mono);letter-spacing:.22em;
    text-transform:uppercase;color:var(--ink);
    margin:38px 0 12px;padding-bottom:7px;
    border-bottom:1px solid var(--hair-soft);
  }
  h3{
    font:500 15px/1.3 var(--mono);color:var(--ink);
    margin:26px 0 8px;scroll-margin-top:18px;
  }
  h3 code{font:inherit;color:var(--red)}
  p{font:400 14.5px/1.65 var(--serif);max-width:66ch;margin-bottom:10px}
  p.label{
    font:500 10px/1 var(--mono);letter-spacing:.14em;
    text-transform:uppercase;color:var(--muted-2);margin:10px 0 5px;
  }
  code{font:400 .92em var(--mono);color:var(--ink-soft)}
  a{color:var(--red);text-decoration:none}
  a:hover{color:var(--red-hover);text-decoration:underline}
  ul{margin:0 0 12px 18px}
  li{font:400 14.5px/1.6 var(--serif);max-width:66ch;margin-bottom:3px}
  .note{
    border-left:2px solid var(--hair);padding:8px 0 8px 14px;
    font:400 13px/1.6 var(--serif);color:var(--muted);
    margin-bottom:18px;max-width:70ch;
  }
  table{border-collapse:collapse;margin:0 0 18px;font-size:13.5px}
  th{
    font:500 10px/1 var(--mono);letter-spacing:.14em;
    text-transform:uppercase;color:var(--muted);
    text-align:left;padding:0 18px 7px 0;
    border-bottom:1px solid var(--hair);
  }
  td{
    padding:5px 18px 5px 0;vertical-align:top;
    border-bottom:1px solid var(--hair-soft);
    font-family:var(--serif);
  }
  /*  the listing plate --- LISTINGS.md X-20's one opt-in spelling.
      `class="code jock"` is what the highlighter keys on and what
      tools/hilite.py checks, so the coloured set and the checked
      set are the same set.  */
  pre.code{
    border-left:2px solid var(--red);
    padding:2px 0 2px 16px;
    font:400 13px/1.6 var(--mono);
    color:var(--ink-body);
    overflow-x:auto;white-space:pre;margin-bottom:10px;
  }
  /*  a listing that MUST refuse is marked, and says so in the
      margin rather than looking like a worked example  */
  pre.code[data-refuses]{border-left-color:var(--muted-2)}
  pre.code[data-refuses]::after{
    content:'refuses %' attr(data-refuses);
    display:block;margin-top:6px;
    font:500 10px/1 var(--mono);letter-spacing:.12em;
    text-transform:uppercase;color:var(--muted-2);
  }
  @media(max-width:700px){
    header.bar{padding:12px 18px}
    main{padding:24px 18px 40px}
  }
</style>
</head>
<body>
<div class="page">
<header class="bar">
  <a href="/">jock</a>
  <span>reference</span>
  <span style="margin-left:auto">{{subtitle}}</span>
</header>
<main>
<h1>{{title}}</h1>
<p class="sub">{{blurb}}</p>
{{body}}
</main>
</div>
</body>
</html>
